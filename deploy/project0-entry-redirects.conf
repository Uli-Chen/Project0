# Install in nginx's http context. Match the deployed page routes only.
# Use $uri for route matching and $request_uri in the redirect for its raw query.
map "$host:$uri" $project0_entry_redirect {
    default 0;
    "auglearn.org:/" 1;
    ~^auglearn\.org:/(coming-soon|preview|login|register|account|cards|essays|memory|onboarding|plan|progress|privacy)/?$ 1;
    ~^auglearn\.org:/(essays|sessions|topics)/[^/]+/?$ 1;
}
