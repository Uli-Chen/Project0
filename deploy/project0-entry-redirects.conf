# Install in nginx's http context. Match the deployed page routes only.
# Matching requests on the main domain go to https://write.auglearn.org (the old
# project0.auglearn.org host redirects there as well).
# Use $uri for route matching and $request_uri in the redirect for its raw query.
map "$host:$uri" $project0_entry_redirect {
    default 0;
    "auglearn.org:/" 1;
    ~^auglearn\.org:/(welcome|preview|login|register|account|cards|essays|ideas|memory|mock|onboarding|plan|practice|progress|privacy)/?$ 1;
    ~^auglearn\.org:/(essays|sessions|topics)/[^/]+/?$ 1;
}
