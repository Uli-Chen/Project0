<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>project 0 · 管理后台原型</title>
<style>
/* ───────── 令牌：沿用 redesign-v1，紧凑版 ───────── */
:root {
  --desk: #eceef1; --panel: #ffffff; --sunk: #f3f4f6; --hover: #f7f8fa;
  --line: #dde1e6; --line-strong: #c4cad3;
  --ink: #1a1d23; --ink-2: #545b66; --ink-3: #868d98;
  --pen: #2f4fa8; --pen-hover: #263f88; --pen-soft: #e7ecf8; --pen-line: #b9c7ea;
  --good: #2f7a4f; --good-soft: #e2f0e7; --warn: #9a5a0a; --warn-soft: #f8ecd6;
  --bad: #b42318; --bad-soft: #fbe7e5;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  --grid: #e8ebef;
  --shadow-panel: 0 1px 2px rgb(20 28 45 / .05);
  --shadow-float: 0 12px 40px -12px rgb(20 28 45 / .28), 0 0 0 1px rgb(20 28 45 / .06);
  --sans: "Geist", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #111317; --panel: #191c22; --sunk: #15171c; --hover: #1e2128;
    --line: #2a2f38; --line-strong: #3a414c;
    --ink: #e8eaee; --ink-2: #a4abb6; --ink-3: #737b87;
    --pen: #8ea7ec; --pen-hover: #a9bdf2; --pen-soft: #1e2741; --pen-line: #34426b;
    --good: #7cc495; --good-soft: #17281e; --warn: #e3b25c; --warn-soft: #2b2114;
    --bad: #f97066; --bad-soft: #2d1614;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    --grid: #232730;
    --shadow-panel: 0 0 0 1px rgb(0 0 0 / .2);
    --shadow-float: 0 16px 48px -12px rgb(0 0 0 / .7), 0 0 0 1px rgb(255 255 255 / .06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #111317; --panel: #191c22; --sunk: #15171c; --hover: #1e2128;
  --line: #2a2f38; --line-strong: #3a414c;
  --ink: #e8eaee; --ink-2: #a4abb6; --ink-3: #737b87;
  --pen: #8ea7ec; --pen-hover: #a9bdf2; --pen-soft: #1e2741; --pen-line: #34426b;
  --good: #7cc495; --good-soft: #17281e; --warn: #e3b25c; --warn-soft: #2b2114;
  --bad: #f97066; --bad-soft: #2d1614;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
  --grid: #232730;
  --shadow-panel: 0 0 0 1px rgb(0 0 0 / .2);
  --shadow-float: 0 16px 48px -12px rgb(0 0 0 / .7), 0 0 0 1px rgb(255 255 255 / .06);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--sans); font-size: 13.5px; line-height: 1.5; color: var(--ink); background: var(--desk); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
.num, td.r, .money { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); }

/* ───────── 外壳 ───────── */
.app { display: grid; grid-template-columns: 216px 1fr; height: 100vh; }
.side { border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px; overflow-y: auto; }
.brand { display: flex; align-items: baseline; gap: 8px; padding: 2px 8px 14px; }
.brand b { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.brand span { font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.nav-group { margin-top: 10px; }
.nav-group > p { font-size: 11px; color: var(--ink-3); padding: 4px 8px; letter-spacing: .02em; }
.nav a { display: flex; align-items: center; gap: 9px; padding: 5px 8px; border-radius: 6px; color: var(--ink-2); text-decoration: none; cursor: pointer; }
.nav a:hover { background: rgb(26 29 35 / .05); color: var(--ink); }
:root[data-theme="dark"] .nav a:hover { background: rgb(255 255 255 / .05); }
.nav a[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-panel); font-weight: 550; }
.nav svg { width: 15px; height: 15px; flex: none; opacity: .8; }
.nav .count { margin-left: auto; font-size: 11px; color: var(--ink-3); }
.nav .dot { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.side-foot { margin-top: auto; padding: 12px 8px 2px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); display: grid; gap: 6px; }
.side-foot .row { display: flex; align-items: center; gap: 6px; }
.pip { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: none; }

.main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.top { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--desk); }
.top h1 { font-size: 15px; font-weight: 600; }
.top .crumb { color: var(--ink-3); font-size: 13px; }
.top .spacer { flex: 1; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--sunk); border: 1px solid var(--line); }
.seg button { padding: 3px 10px; border-radius: 6px; font-size: 12.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .1); }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--ink-2); background: var(--panel); }
.search-btn { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-3); min-width: 220px; }
.search-btn svg { width: 14px; height: 14px; }
.search-btn .kbd { margin-left: auto; }
.icon-btn { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 7px; color: var(--ink-2); }
.icon-btn:hover { background: var(--sunk); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }
.sample { font-size: 11.5px; color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.view { flex: 1; overflow-y: auto; padding: 18px 20px 60px; }
.view-inner { max-width: 1320px; margin: 0 auto; display: grid; gap: 16px; }

/* ───────── 组件 ───────── */
.panel { background: var(--panel); border-radius: 10px; box-shadow: var(--shadow-panel); border: 1px solid var(--line); min-width: 0; }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.panel-h h2 { font-size: 13.5px; font-weight: 600; }
.panel-h .sub { color: var(--ink-3); font-size: 12px; }
.panel-h .spacer { flex: 1; }
.panel-b { padding: 14px; }
.grid2 { display: grid; grid-template-columns: 1.7fr 1fr; gap: 16px; }
.grid2e { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 7px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn svg { width: 14px; height: 14px; }
.btn-primary { background: var(--pen); color: #fff; }
:root[data-theme="dark"] .btn-primary { color: #0f1424; }
.btn-primary:hover { background: var(--pen-hover); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; }
.btn-secondary { background: var(--panel); border: 1px solid var(--line-strong); }
.btn-secondary:hover { border-color: var(--ink-3); }
.btn-secondary:disabled { opacity: .5; cursor: not-allowed; }
.btn-ghost { color: var(--ink-2); padding: 0 8px; }
.btn-ghost:hover { background: var(--sunk); color: var(--ink); }
.btn-danger { color: var(--bad); border: 1px solid var(--line-strong); background: var(--panel); }
.btn-danger:hover { border-color: var(--bad); }
.btn-xs { height: 24px; padding: 0 8px; font-size: 12px; border-radius: 6px; }

.chip { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 11.5px; background: var(--sunk); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.pen { background: var(--pen-soft); color: var(--pen); border-color: transparent; }
.chip svg { width: 11px; height: 11px; }

.money { display: inline-flex; align-items: baseline; gap: 5px; white-space: nowrap; }
.money b { font-weight: 550; }
.money i { font-style: normal; color: var(--ink-3); font-size: .86em; }
.money.neg b { color: var(--bad); }

input.inp, select.inp { height: 30px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--panel); padding: 0 9px; min-width: 0; }
input.inp:focus, select.inp:focus { outline: 2px solid var(--pen-line); border-color: var(--pen); }
input.inp.invalid { border-color: var(--bad); }
label.fld { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
label.fld .hint { color: var(--ink-3); font-size: 11.5px; }
label.fld .err { color: var(--bad); font-size: 11.5px; }

/* 表格 */
.tbl-wrap { overflow: auto; }
table { width: 100%; border-collapse: collapse; }
th { position: sticky; top: 0; z-index: 1; background: var(--panel); text-align: left; font-weight: 500; font-size: 12px; color: var(--ink-3); padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; }
th.sort { cursor: pointer; } th.sort:hover { color: var(--ink); }
th.r, td.r { text-align: right; }
td { padding: 6px 10px; border-bottom: 1px solid var(--line); height: 34px; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--hover); }
tbody tr.focus td { background: var(--pen-soft); }
tbody tr.sel td { background: color-mix(in oklab, var(--pen-soft) 60%, transparent); }
td .who { display: grid; line-height: 1.3; }
td .who small { color: var(--ink-3); font-size: 11.5px; }
input[type=checkbox] { accent-color: var(--pen); width: 14px; height: 14px; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
.kpi { padding: 13px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.kpi:nth-child(4n) { border-right: 0; }
.kpi:nth-last-child(-n+4) { border-bottom: 0; }
.kpi p { font-size: 12px; color: var(--ink-2); }
.kpi .v { font-size: 22px; font-weight: 600; letter-spacing: -.01em; margin-top: 3px; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 6px; }
.kpi .v i { font-style: normal; font-size: 13px; font-weight: 450; color: var(--ink-3); }
.kpi .d { font-size: 12px; margin-top: 2px; color: var(--ink-3); }
.kpi .d .up { color: var(--ink-2); } .kpi .d .good { color: var(--good); } .kpi .d .bad { color: var(--bad); }
.meter { height: 4px; border-radius: 2px; background: var(--sunk); margin-top: 7px; overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--pen); border-radius: 2px; }

/* 图表 */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .ax { font-size: 10.5px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .base { stroke: var(--line-strong); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .hit:hover { fill: rgb(127 127 127 / .07); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border-radius: 8px; box-shadow: var(--shadow-float); padding: 8px 10px; font-size: 12px; min-width: 190px; z-index: 5; display: none; }
.tip h4 { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 6px; line-height: 1.7; }
.tip .r i { width: 8px; height: 8px; border-radius: 2px; }
.tip .r .money { margin-left: auto; }
.tip .tot { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; font-weight: 550; }

/* 告警 */
.alerts { display: grid; }
.alert { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: start; }
.alert:last-child { border-bottom: 0; }
.alert svg { width: 16px; height: 16px; margin-top: 2px; }
.alert.warn svg { color: var(--warn); } .alert.bad svg { color: var(--bad); } .alert.info svg { color: var(--ink-3); }
.alert b { font-weight: 550; display: block; }
.alert p { font-size: 12px; color: var(--ink-2); }
.alert time { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }

/* 工具条 */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.toolbar .spacer { flex: 1; }
.views { display: flex; gap: 4px; flex-wrap: wrap; }
.views button { height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12.5px; color: var(--ink-2); border: 1px solid transparent; }
.views button:hover { background: var(--sunk); }
.views button[aria-pressed="true"] { background: var(--pen-soft); color: var(--pen); }
.views button .n { color: var(--ink-3); margin-left: 4px; font-size: 11.5px; }
.bulk { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--pen-soft); border-bottom: 1px solid var(--pen-line); font-size: 12.5px; color: var(--pen); }
.pager { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 12px; }
.pager .spacer { flex: 1; }

/* 抽屉 / 对话框 / 面板 */
.scrim { position: fixed; inset: 0; background: rgb(15 18 25 / .32); z-index: 20; display: none; }
.scrim.on { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); background: var(--panel); z-index: 21; box-shadow: var(--shadow-float); transform: translateX(102%); transition: transform .24s cubic-bezier(.22,1,.36,1); display: flex; flex-direction: column; }
.drawer.on { transform: none; }
.drawer-h { padding: 16px 18px 0; border-bottom: 1px solid var(--line); }
.drawer-h .id { display: flex; align-items: center; gap: 10px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--pen-soft); color: var(--pen); font-weight: 600; flex: none; }
.drawer-h h3 { font-size: 16px; font-weight: 600; }
.drawer-h .meta { font-size: 12px; color: var(--ink-3); }
.drawer-h .acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.tabs { display: flex; gap: 2px; }
.tabs button { padding: 7px 10px; font-size: 13px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pen); font-weight: 550; }
.drawer-b { flex: 1; overflow-y: auto; padding: 16px 18px 40px; display: grid; gap: 14px; align-content: start; }
.dl { display: grid; grid-template-columns: 110px 1fr; gap: 7px 14px; font-size: 13px; }
.dl dt { color: var(--ink-3); }
.mini-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mini-kpis > div { background: var(--sunk); border-radius: 8px; padding: 9px 11px; }
.mini-kpis p { font-size: 11.5px; color: var(--ink-2); }
.mini-kpis .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
.note { font-size: 12px; color: var(--ink-2); background: var(--sunk); border-radius: 8px; padding: 9px 11px; display: flex; gap: 8px; }
.note svg { width: 14px; height: 14px; flex: none; margin-top: 2px; color: var(--ink-3); }
.note.warn { background: var(--warn-soft); color: var(--warn); } .note.warn svg { color: var(--warn); }
.note.good { background: var(--good-soft); color: var(--good); } .note.good svg { color: var(--good); }
.note.bad { background: var(--bad-soft); color: var(--bad); } .note.bad svg { color: var(--bad); }
.glass { border: 1px dashed var(--warn); border-radius: 8px; padding: 12px; font-family: Georgia, "Songti SC", serif; font-size: 14px; line-height: 1.7; color: var(--ink); }

.modal { position: fixed; left: 50%; top: 12vh; transform: translateX(-50%); width: min(520px, calc(100vw - 32px)); background: var(--panel); border-radius: 12px; box-shadow: var(--shadow-float); z-index: 31; display: none; }
.modal.on { display: block; }
.modal-h { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.modal-h h3 { font-size: 15px; font-weight: 600; }
.modal-b { padding: 16px 18px; display: grid; gap: 12px; }
.modal-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.modal-f .spacer { flex: 1; }
.scrim.modal-scrim { z-index: 30; }
.steps { display: flex; gap: 6px; font-size: 12px; color: var(--ink-3); }
.steps span { display: inline-flex; align-items: center; gap: 5px; }
.steps span b { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; background: var(--sunk); border: 1px solid var(--line); font-weight: 600; }
.steps span.on { color: var(--ink); } .steps span.on b { background: var(--pen); color: #fff; border-color: var(--pen); }
.steps span.done b { background: var(--good-soft); color: var(--good); border-color: transparent; }
.probe { font-family: var(--mono); font-size: 12px; background: var(--sunk); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }

.palette { position: fixed; left: 50%; top: 14vh; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); background: var(--panel); border-radius: 12px; box-shadow: var(--shadow-float); z-index: 41; display: none; overflow: hidden; }
.palette.on { display: block; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; font-size: 15px; background: transparent; outline: none; }
.palette ul { list-style: none; max-height: 360px; overflow-y: auto; padding: 6px; }
.palette li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
.palette li small { color: var(--ink-3); margin-left: auto; font-size: 12px; }
.palette li.on { background: var(--pen-soft); }
.palette .grp { font-size: 11px; color: var(--ink-3); padding: 8px 10px 3px; }
.scrim.pal-scrim { z-index: 40; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 9px; font-size: 13px; opacity: 0; transition: all .2s; z-index: 50; pointer-events: none; }
.toast.on { opacity: 1; transform: translateX(-50%); }

/* 提供商卡片 */
.prov { display: grid; grid-template-columns: 1fr; }
.prov-row { display: grid; grid-template-columns: 1.3fr 1.6fr 1.2fr 1fr 1fr auto; gap: 14px; align-items: center; padding: 14px; border-bottom: 1px solid var(--line); }
.prov-row:last-child { border-bottom: 0; }
.prov-row .nm { display: grid; gap: 2px; } .prov-row .nm b { font-size: 14px; font-weight: 600; }
.kv { display: grid; gap: 1px; font-size: 12px; } .kv span:first-child { color: var(--ink-3); }
.spark { display: flex; align-items: end; gap: 1px; height: 22px; }
.spark i { width: 3px; background: var(--pen-line); border-radius: 1px 1px 0 0; }
.spark i.e { background: var(--bad); }

/* 路由 */
.route-group td:first-child { font-weight: 550; }
select.inline { height: 26px; font-size: 12.5px; padding: 0 6px; }

/* 计算器 */
.calc { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.calc .ins { display: grid; gap: 10px; }
.calc .out { display: grid; gap: 8px; align-content: start; }
.calc .out .line { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.calc .out .line.big { font-size: 15px; font-weight: 600; border-bottom: 0; }
input[type=range] { accent-color: var(--pen); width: 100%; }

const OUTCOME = { ok: ["good", "ok"], timeout: ["warn", "timeout"], invalid_output: ["warn", "invalid_output"], provider_error: ["bad", "provider_error"] };

VIEWS.calls = () => {

function callTable(list) {

function callPivot(list) {
  const map = new Map();
  list.forEach(c => { const k = c.site; const m = map.get(k) || { site: k, group: c.group, n: 0, inp: 0, out: 0, cost: 0, fail: 0, lat: [] }; m.n++; m.inp += c.inp; m.out += c.out; m.cost += c.cost; if (c.outcome !== "ok") m.fail++; m.lat.push(c.lat); map.set(k, m); });
  const rows = [...map.values()].sort((a, b) => b.cost - a.cost); const max = Math.max(...rows.map(r => r.cost));

  </tbody></table></div>`;
}
after.calls = () => {

  $("#modal").innerHTML = `<div class="modal-h"><h3>记一笔${u ? " · " + esc(u.name) : ""}</h3></div><div class="modal-b">
    ${u ? "" : `<label class="fld">用户<input class="inp" placeholder="邮箱或 ID"></label>`}
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px"><label class="fld">类型<select class="inp"><option>收款</option><option>退款</option><option>调整</option><option>赠送</option></select></label><label class="fld">金额<input class="inp" value="79"></label><label class="fld">币种<select class="inp"><option>CNY</option><option>USD</option><option>TWD</option></select></label></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="fld">渠道<select class="inp"><option>手工 · 微信转账</option><option>手工 · 支付宝</option><option>手工 · 银行转账</option></select></label><label class="fld">外部单号<input class="inp mono"></label></div>
    <span class="hint faint" style="font-size:12px">汇率按发生日的 fx_rates 记录（示例 1 USD = ${FX} CNY）</span>
    <label class="fld">管理员密码<input class="inp" id="cf-pw" type="password"></label></div>
    <div class="modal-f"><button class="btn btn-ghost" data-act="close-modal">取消</button><button class="btn btn-primary" id="cf-ok" disabled>保存</button></div>`;
  $("#cf-pw").addEventListener("input", () => $("#cf-ok").disabled = $("#cf-pw").value.length < 4);
  $("#cf-ok").addEventListener("click", () => { closeModal(); toast("已记入收款流水，并写入审计（原型）"); });
  openModal();
}

/* ═════════ 命令面板 ═════════ */
let PAL = { items: [], idx: 0 };
function openPalette() { $("#palette").classList.add("on"); $("#pal-scrim").classList.add("on"); const i = $("#pal-input"); i.value = ""; renderPalette(""); i.focus(); }
function closePalette() { $("#palette").classList.remove("on"); $("#pal-scrim").classList.remove("on"); }
function renderPalette(q) {
  q = q.trim().toLowerCase();
  const pages = Object.entries(TITLES).filter(([k, [n]]) => !q || n.includes(q) || k.includes(q)).map(([k, [n, g]]) => ({ t: "page", k, label: n, sub: g || "" }));
  const users = USERS.filter(u => q && (u.name.toLowerCase().includes(q) || u.email.includes(q) || u.id.includes(q))).slice(0, 6).map(u => ({ t: "user", k: u.id, label: u.name, sub: u.email }));
  PAL.items = [...users, ...pages]; PAL.idx = 0;
  let html = ""; let i = 0;
  if (users.length) html += `<li class="grp">用户</li>` + users.map(x => `<li data-pi="${i}" class="${i++ === 0 ? "on" : ""}">${ic("users")}<span>${esc(x.label)}</span><small>${esc(x.sub)}</small></li>`).join("");
  if (pages.length) html += `<li class="grp">页面</li>` + pages.map(x => `<li data-pi="${i}" class="${i++ === 0 ? "on" : ""}"><span>${x.label}</span><small>${x.sub}</small></li>`).join("");
  $("#pal-list").innerHTML = html || `<li class="faint">没有结果</li>`;
}
function palGo(i) { const x = PAL.items[i]; if (!x) return; closePalette(); if (x.t === "page") go(x.k); else { if (S.route !== "users") go("users"); openUser(x.k); } }
$("#pal-input").addEventListener("input", e => renderPalette(e.target.value));
$("#pal-input").addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); PAL.idx = (PAL.idx + (e.key === "ArrowDown" ? 1 : -1) + PAL.items.length) % PAL.items.length; document.querySelectorAll("#pal-list li[data-pi]").forEach(li => li.classList.toggle("on", +li.dataset.pi === PAL.idx)); document.querySelector(`#pal-list li[data-pi="${PAL.idx}"]`)?.scrollIntoView({ block: "nearest" }); }
  if (e.key === "Enter") palGo(PAL.idx);
});
$("#pal-list").addEventListener("click", e => { const li = e.target.closest("[data-pi]"); if (li) palGo(+li.dataset.pi); });

/* ═════════ 事件 ═════════ */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { closeDrawer(); go(g.dataset.go); return; }
  const r = e.target.closest("[data-range]"); if (r) { S.range = r.dataset.range === "m" ? "m" : +r.dataset.range; render(); return; }
  const cb = e.target.closest("[data-sel]"); if (cb) { e.stopPropagation(); cb.checked ? S.sel.add(cb.dataset.sel) : S.sel.delete(cb.dataset.sel); render(); return; }
  const st = e.target.closest("[data-sort]"); if (st) { const k = st.dataset.sort; S.sort = [k, S.sort[0] === k ? -S.sort[1] : (k === "name" || k === "created" || k === "lastSeen" ? 1 : -1)]; render(); return; }
  const md = e.target.closest("[data-model]"); if (md) { PRICE_MODEL = md.dataset.model; NEWP = null; render(); return; }
  const ca = e.target.closest("[data-call]"); if (ca) { S.expanded = S.expanded === ca.dataset.call ? null : ca.dataset.call; render(); return; }
  const a = e.target.closest("[data-act]");
  if (a) {
    const v = a.dataset.v;
    switch (a.dataset.act) {
      case "palette": return openPalette();
      case "close-palette": return closePalette();
      case "theme": { const root = document.documentElement; const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; root.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("admin-theme", root.dataset.theme); } catch {} return; }
      case "chart-mode": S.chartTable = v === "1"; return render();
      case "user-view": S.userView = v; S.sel.clear(); if (S.route !== "users") go("users"); else render(); return;
      case "sel-all": { const list = filteredUsers(); a.checked ? list.forEach(u => S.sel.add(u.id)) : list.forEach(u => S.sel.delete(u.id)); return render(); }
      case "bulk": if (v === "clear") { S.sel.clear(); return render(); } { const n = S.sel.size; const label = { suspend: "暂停", resume: "恢复", credit: "赠送额度" }[v]; return confirmModal(`批量${label} ${n} 个用户`, `<p class="muted">将对已选的 ${n} 个用户执行「${label}」，并逐条写入审计日志。</p>`, "确认", v === "suspend", () => { if (v !== "credit") USERS.forEach(u => { if (S.sel.has(u.id) && u.role !== "admin") u.status = v === "suspend" ? "suspended" : "active"; }); S.sel.clear(); render(); toast(`已${label} ${n} 个用户`); }); }
      case "close-drawer": return closeDrawer();
      case "close-modal": return closeModal();
      case "dtab": S.drawerTab = v; return renderDrawer();
      case "suspend": return confirmModal(`暂停 ${esc(S.drawerUser.name)}`, `<p class="muted">撤销全部会话、拒绝登录、拒绝新的模型调用。数据保留，可随时恢复。</p><label class="fld">理由<input class="inp" value="多账号共享"></label>`, "暂停", true, () => { S.drawerUser.status = "suspended"; renderDrawer(); render(); toast("已暂停，审计已记录"); });
      case "resume": S.drawerUser.status = "active"; renderDrawer(); render(); return toast("已恢复");
      case "revoke": S.drawerUser.sessions = 0; renderDrawer(); return toast("已撤销全部会话");
      case "delete-user": return confirmModal(`删除 ${esc(S.drawerUser.name)} 的账户`, `<div class="note bad">${ic("warn")}<span>级联删除会话、练习、反馈、调用记录与 payload，无法恢复。收款流水保留（匿名化）。</span></div>`, "永久删除", true, () => { toast("已删除（原型未实际删除）"); closeDrawer(); }, S.drawerUser.email);
      case "glass": return glassModal();
      case "ledger-modal": return ledgerModal();
      case "calls-for": closeDrawer(); S.callFilter = { outcome: "", group: "", q: S.drawerUser.email }; return go("calls");
      case "op": S.callFilter.q = ""; toast(`操作 ${v}：深度练习 · 共 23 次调用 · ${"¥0.43"}（原型）`); return;
      case "pivot": S.callPivot = v === "1"; return render();
      case "prov-edit": return openProvEdit(v);
      case "pe-test": PE.probe = "running"; PE.step = 2; renderProvEdit(); setTimeout(() => { if (!PE) return; PE.probe = "ok"; PE.step = 3; renderProvEdit(); $("#pe-pw")?.focus(); }, 1100); return;
      case "pe-save": return saveProv();
      case "new-price": { const cur = MODELS.find(m => m.id === PRICE_MODEL).prices.find(p => !p.to); NEWP = { model: PRICE_MODEL, from: "2026-11-05", inp: cur.inp, cr: cur.cr ?? "", out: cur.out, src: cur.src }; return render(); }
      case "cancel-price": NEWP = null; return render();
      case "save-price": return confirmModal("保存新价格", `<p class="muted">${PRICE_MODEL} 自 ${NEWP.from} 起：输入 $${NEWP.inp} · 缓存读 $${NEWP.cr || "—"} · 输出 $${NEWP.out}。上一条价格的截止日期写为 ${NEWP.from}。</p>`, "保存", false, () => { const m = MODELS.find(x => x.id === PRICE_MODEL); m.prices.find(p => !p.to).to = NEWP.from; m.prices.push({ from: NEWP.from, to: null, inp: +NEWP.inp, out: +NEWP.out, cr: NEWP.cr === "" ? null : +NEWP.cr, cw: null, cur: "USD", src: NEWP.src, verified: "2026-11-04" }); AUDIT.unshift({ at: "2026-11-04 " + pad(new Date().getHours()) + ":" + pad(new Date().getMinutes()), who: "uli-chen", act: "price.create", target: PRICE_MODEL, detail: `生效 ${NEWP.from} · 输入 $${NEWP.inp} / 输出 $${NEWP.out}`, reason: "—" }); NEWP = null; render(); toast("价格已保存"); });
      case "toast": return toast(a.dataset.msg);
    }
    return;
  }
  const ur = e.target.closest("[data-user]"); if (ur) { openUser(ur.dataset.user); return; }
});
document.addEventListener("change", e => { if (e.target.matches('[data-act-change="route"]')) toast("路由草稿已修改：保存后生成 route-20261104-v1（原型）"); });
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#palette").classList.contains("on") ? closePalette() : openPalette(); return; }
  if (e.key === "Escape") { if ($("#palette").classList.contains("on")) return closePalette(); if ($("#modal").classList.contains("on")) { PE = null; return closeModal(); } if ($("#drawer").classList.contains("on")) return closeDrawer(); }
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (typing || S.route !== "users" || $("#drawer").classList.contains("on") || $("#modal").classList.contains("on")) return;
  const list = filteredUsers();
  if (e.key === "j" || e.key === "k") { S.focus = Math.max(0, Math.min(list.length - 1, S.focus + (e.key === "j" ? 1 : -1))); render(); document.querySelector(`tr[data-idx="${S.focus}"]`)?.scrollIntoView({ block: "nearest" }); }
  if (e.key === "Enter" && S.focus >= 0) openUser(list[S.focus].id);
  if (e.key === "x" && S.focus >= 0) { const id = list[S.focus].id; S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); render(); }
});

try { const t = localStorage.getItem("admin-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
const h = location.hash.slice(1); if (VIEWS[h]) S.route = h;
render();
</script>
</body>
</html>
